syntax = "proto3";
package orders;

enum OrderStatus { PENDING = 0; CONFIRMED = 1; PAID = 2; SHIPPED = 3; DELIVERED = 4; CANCELLED = 5; REFUNDED = 6; }
service OrderService {
  rpc CreateOrder(CreateOrderRequest) returns (OrderResponse);
  rpc GetOrder(GetOrderRequest) returns (OrderResponse);
  rpc ListOrders(ListOrdersRequest) returns (OrderList);
  rpc CancelOrder(CancelOrderRequest) returns (OrderResponse);
  rpc GetOrderAdmin(GetOrderAdminRequest) returns (OrderResponse);
  rpc ListOrdersAdmin(ListOrdersAdminRequest) returns (OrderList);
  rpc UpdateOrderStatus(UpdateOrderStatusRequest) returns (OrderResponse);
}
message OrderItemRequest { string product_id = 1; int64 quantity = 2; }
message CreateOrderRequest { string user_id = 1; string idempotency_key = 2; repeated OrderItemRequest items = 3; string currency = 4; string shipping_address_json = 5; }
message GetOrderRequest { string id = 1; string user_id = 2; }
message CancelOrderRequest { string id = 1; string user_id = 2; string note = 3; }
message GetOrderAdminRequest { string id = 1; }
message ListOrdersRequest { string user_id = 1; int32 page_size = 2; string page_token = 3; optional OrderStatus status = 4; }
message ListOrdersAdminRequest { int32 page_size = 1; string page_token = 2; string user_id = 3; optional OrderStatus status = 4; string created_after = 5; string created_before = 6; }
message UpdateOrderStatusRequest { string id = 1; OrderStatus status = 2; string changed_by = 3; string note = 4; }
message OrderItem { string product_id = 1; string product_name = 2; string sku = 3; int64 unit_price_minor = 4; int64 quantity = 5; int64 line_total_minor = 6; }
message Order { string id = 1; string user_id = 2; OrderStatus status = 3; int64 total_minor = 4; string currency = 5; string shipping_address_json = 6; repeated OrderItem items = 7; string created_at = 8; string updated_at = 9; }
message OrderResponse { Order order = 1; }
message OrderList { repeated Order orders = 1; string next_page_token = 2; }
